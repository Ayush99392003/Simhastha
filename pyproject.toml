[project]
name = "simhastha-crowd-intelligence"
version = "0.1.0"
description = "Crowd flow prediction and route optimization for Simhastha Ujjain 2028"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "networkx>=3.3",
    "rich>=13.7.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.3",
    "ruff>=0.15.16",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]
